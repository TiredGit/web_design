
name: Chromatic

on: push

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab4_webdesign/design_system/package-lock.json

      - name: Install dependencies
        working-directory: lab4_webdesign/design_system
        run: npm ci

      - name: Run Chromatic
        working-directory: lab4_webdesign/design_system
        run: npx chromatic --project-token="${{ secrets.CHROMATIC_TOKEN }}"
